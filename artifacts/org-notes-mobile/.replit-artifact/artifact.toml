kind = "mobile"
previewPath = "/"
title = "Органайзер заметок"
description = "Кроссплатформенное мобильное приложение для создания, редактирования, поиска и удаления рабочих заметок с выбором локального хранения в SQLite или файлах устройства."
version = "1.0.0"
id = "artifacts/org-notes-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21278

[services.development]
run = "pnpm --filter @workspace/org-notes-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/org-notes-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/org-notes-mobile", "run", "serve" ]

[services.env]
PORT = "21278"
BASE_PATH = "/"
